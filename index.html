<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DBTI 狗格测试</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.86em' font-size='88'%3ED%3C/text%3E%3C/svg%3E"
    />
    <style>
      :root {
        --ink: #24232a;
        --muted: #6a6470;
        --paper: #f4edf2;
        --card: rgba(255, 253, 248, 0.92);
        --line: rgba(36, 35, 42, 0.13);
        --purple: #7e6096;
        --mint: #a9d9c9;
        --yellow: #dfbd52;
        --coral: #db7f78;
        --blue: #5b9bb2;
        --shadow: 0 22px 58px rgba(49, 42, 57, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family:
          ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        letter-spacing: 0;
        background:
          linear-gradient(160deg, rgba(126, 96, 150, 0.18), transparent 34%),
          linear-gradient(24deg, rgba(169, 217, 201, 0.36), transparent 40%),
          linear-gradient(180deg, rgba(223, 189, 82, 0.14), transparent 62%),
          var(--paper);
      }

      button,
      input {
        font: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .app {
        width: min(960px, calc(100% - 28px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 0;
      }

      .screen {
        display: none;
      }

      .screen.active {
        display: block;
      }

      .poster {
        min-height: calc(100vh - 48px);
        display: grid;
        place-items: center;
      }

      .poster-copy {
        position: relative;
        width: min(620px, 100%);
        padding: 36px 24px 24px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background:
          radial-gradient(circle at 88% 16%, rgba(223, 189, 82, 0.24), transparent 22%),
          radial-gradient(circle at 10% 90%, rgba(169, 217, 201, 0.34), transparent 24%),
          linear-gradient(135deg, rgba(255, 255, 255, 0.72), transparent),
          var(--card);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .poster-copy::before,
      .poster-copy::after {
        content: "";
        position: absolute;
        width: 58px;
        height: 18px;
        border: 1px solid rgba(36, 35, 42, 0.08);
        background: rgba(255, 255, 255, 0.56);
        box-shadow: 0 8px 18px rgba(49, 42, 57, 0.1);
      }

      .poster-copy::before {
        top: -10px;
        left: 28px;
        transform: rotate(-8deg);
      }

      .poster-copy::after {
        right: 34px;
        bottom: -8px;
        transform: rotate(7deg);
      }

      .poster-mark {
        position: absolute;
        top: 24px;
        right: 22px;
        display: grid;
        width: 74px;
        height: 74px;
        place-items: center;
        border: 2px dashed rgba(126, 96, 150, 0.36);
        border-radius: 50%;
        color: var(--purple);
        background: rgba(255, 253, 248, 0.6);
        font-size: 20px;
        font-weight: 1000;
        transform: rotate(9deg);
      }

      .pin {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: #4d4656;
        background: rgba(255, 255, 255, 0.7);
        font-size: 13px;
        font-weight: 850;
        box-shadow: 0 8px 20px rgba(49, 42, 57, 0.08);
      }

      .poster h1 {
        margin: 20px 0 12px;
        font-size: clamp(48px, 8vw, 92px);
        line-height: 0.92;
        letter-spacing: 0;
      }

      .designer {
        margin: 16px 0 0;
        padding-top: 14px;
        border-top: 1px solid var(--line);
        color: var(--purple);
        font-size: 13px;
        font-weight: 950;
        text-align: right;
      }

      .lead {
        max-width: 460px;
        margin: 0 0 22px;
        color: #514b55;
        font-size: 17px;
        line-height: 1.75;
      }

      .start-card {
        max-width: none;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        box-shadow: var(--shadow);
      }

      .name-label {
        display: block;
        margin-bottom: 8px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 900;
      }

      .name-row {
        display: flex;
        gap: 10px;
      }

      .name-row.stacked {
        display: grid;
        grid-template-columns: 1fr 1fr auto;
      }

      .name-row input {
        min-width: 0;
        flex: 1;
        height: 48px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: #fffdf8;
        outline: 0;
        font-weight: 850;
      }

      .primary-btn,
      .ghost-btn {
        min-height: 46px;
        padding: 0 18px;
        border-radius: 8px;
        font-weight: 950;
      }

      .primary-btn {
        color: #fff;
        background: var(--ink);
        box-shadow: 0 14px 26px rgba(36, 35, 42, 0.22);
      }

      .primary-btn:disabled {
        cursor: not-allowed;
        opacity: 0.42;
        box-shadow: none;
      }

      .ghost-btn {
        color: #5f5962;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.62);
      }

      .quiz-shell,
      .result-shell {
        min-height: calc(100vh - 48px);
        display: grid;
        place-items: center;
      }

      .quiz-card,
      .result-card {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--card);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
      }

      .counter {
        color: var(--muted);
        font-size: 14px;
        font-weight: 900;
      }

      .meter {
        width: 172px;
        height: 9px;
        padding: 2px;
        border-radius: 6px;
        background: #e9e0d5;
      }

      .meter span {
        display: block;
        width: var(--progress, 0%);
        height: 100%;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--coral), var(--yellow), var(--mint));
        transition: width 180ms ease;
      }

      .quiz-body {
        padding: 24px;
      }

      .kicker {
        margin-bottom: 14px;
        color: var(--blue);
        font-size: 13px;
        font-weight: 1000;
        letter-spacing: 0.08em;
      }

      .question {
        margin: 0;
        font-size: clamp(26px, 5vw, 44px);
        line-height: 1.12;
      }

      .hint {
        margin: 12px 0 20px;
        color: var(--muted);
        font-size: 15px;
        line-height: 1.65;
      }

      .answers {
        display: grid;
        gap: 12px;
      }

      .answer {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 12px;
        align-items: start;
        min-height: 88px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        color: var(--ink);
        text-align: left;
        background: #fffdf8;
        box-shadow: 0 10px 22px rgba(49, 42, 57, 0.07);
        transition: 160ms ease;
      }

      .answer:hover,
      .answer.selected {
        transform: translateY(-2px);
        border-color: rgba(126, 96, 150, 0.58);
        box-shadow: 0 16px 30px rgba(49, 42, 57, 0.12);
      }

      .answer.selected {
        background: #f3ecf6;
        outline: 3px solid rgba(126, 96, 150, 0.13);
      }

      .answer em {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        background: var(--purple);
        font-style: normal;
        font-size: 14px;
        font-weight: 1000;
      }

      .answer strong {
        display: block;
        margin-bottom: 5px;
        font-size: 17px;
      }

      .answer span {
        display: block;
        color: #655f66;
        font-size: 14px;
        line-height: 1.55;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-top: 20px;
      }

      .result-card {
        width: min(620px, 100%);
        display: block;
      }

      .result-media {
        margin: 16px 0 18px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #f2eaf3;
      }

      .result-media img {
        display: block;
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 12px;
        object-fit: cover;
        background: #fffdf8;
        box-shadow: 0 16px 30px rgba(49, 42, 57, 0.16);
      }

      .result-copy {
        padding: 28px;
      }

      .result-dog {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 14px;
        font-weight: 900;
      }

      .result-code {
        display: block;
        width: fit-content;
        margin-bottom: 12px;
        padding: 8px 13px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--blue);
        background: rgba(255, 255, 255, 0.7);
        font-size: clamp(34px, 8vw, 56px);
        font-weight: 1000;
        letter-spacing: 0.06em;
      }

      .result-title {
        margin: 0;
        font-size: clamp(42px, 8vw, 76px);
        line-height: 0.95;
      }

      .verdict {
        margin: 0;
        color: #2e2931;
        font-size: clamp(20px, 4vw, 30px);
        line-height: 1.32;
        font-weight: 950;
      }

      .result-actions {
        display: flex;
        gap: 10px;
        margin-top: 22px;
      }

      .result-actions button {
        flex: 1;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        z-index: 5;
        transform: translate(-50%, 16px);
        padding: 12px 16px;
        border-radius: 8px;
        color: #fff;
        background: var(--ink);
        opacity: 0;
        pointer-events: none;
        transition: 180ms ease;
        font-size: 14px;
        font-weight: 850;
      }

      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }

      .share-modal {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: none;
        place-items: center;
        padding: 18px;
        background: rgba(36, 35, 42, 0.48);
        backdrop-filter: blur(10px);
      }

      .share-modal.show {
        display: grid;
      }

      .share-panel {
        width: min(420px, 100%);
        max-height: calc(100vh - 36px);
        display: grid;
        gap: 12px;
        padding: 14px;
        border: 1px solid rgba(255, 255, 255, 0.38);
        border-radius: 16px;
        background: #fffdf8;
        box-shadow: 0 26px 70px rgba(20, 18, 24, 0.3);
      }

      .share-panel h3 {
        margin: 0;
        font-size: 20px;
        line-height: 1.25;
      }

      .share-panel p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.5;
      }

      .share-preview {
        width: 100%;
        max-height: min(62vh, 560px);
        border-radius: 12px;
        object-fit: contain;
        background: #f4edf2;
        box-shadow: 0 16px 34px rgba(49, 42, 57, 0.14);
      }

      .share-modal-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .share-modal-actions .ghost-btn {
        background: #fff;
      }

      .share-modal-actions #closeShareBtn {
        grid-column: 1 / -1;
      }

      @media (max-width: 820px) {
        .app {
          width: min(100% - 22px, 560px);
          padding: 14px 0 22px;
        }

        .poster {
          min-height: calc(100vh - 28px);
        }

        .poster-copy {
          padding: 28px 16px 18px;
        }

        .poster-mark {
          top: 18px;
          right: 14px;
          width: 58px;
          height: 58px;
          font-size: 16px;
        }

        .poster h1 {
          font-size: clamp(46px, 15vw, 68px);
        }

        .lead {
          font-size: 15px;
        }

        .name-row,
        .name-row.stacked {
          display: flex;
          flex-direction: column;
        }

        .quiz-shell,
        .result-shell {
          min-height: auto;
        }

        .quiz-body {
          padding: 18px;
        }

        .topbar {
          padding: 14px;
        }

        .meter {
          width: 118px;
        }

        .answer {
          grid-template-columns: 30px 1fr;
          min-height: 78px;
          padding: 14px;
          gap: 10px;
        }

        .answer em {
          width: 30px;
          height: 30px;
        }

        .nav,
        .result-actions {
          position: sticky;
          bottom: 0;
          margin: 18px -18px -18px;
          padding: 12px 18px;
          border-top: 1px solid var(--line);
          background: rgba(255, 253, 248, 0.92);
          backdrop-filter: blur(14px);
        }

        .result-media {
          margin: 14px 0 16px;
          padding: 10px;
        }

        .result-media img {
          max-height: 44vh;
          object-fit: contain;
        }

        .result-copy {
          padding: 20px;
        }

        .result-actions {
          margin: 20px -20px -20px;
        }

        .share-modal {
          padding: 10px;
          align-items: end;
        }

        .share-panel {
          max-height: calc(100vh - 20px);
        }

        .share-preview {
          max-height: 58vh;
        }
      }

      @media (max-width: 420px) {
        .app {
          width: min(100% - 16px, 420px);
        }

        .poster h1 {
          font-size: 44px;
        }

        .question {
          font-size: 25px;
        }

        .answer strong {
          font-size: 16px;
        }

        .answer span {
          font-size: 13px;
        }

        .result-title {
          font-size: 44px;
        }

        .verdict {
          font-size: 19px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="screen active" id="homeScreen">
        <div class="poster">
          <div class="poster-copy">
            <div class="poster-mark" aria-hidden="true">DBTI</div>
            <div class="pin">DBTI 狗格测试</div>
            <h1>DBTI<br />狗格测试</h1>
            <p class="lead">
              输入你家狗的名字，做 10 道不太正经的题。测完你会得到一张狗格判词图，适合发给朋友一起审判。
            </p>
            <div class="start-card">
              <label class="name-label" for="dogNameInput">先交代一下狗狗姓名</label>
              <div class="name-row stacked">
                <input id="dogNameInput" maxlength="12" placeholder="宠物昵称，比如：土豆" autocomplete="off" />
                <input id="breedInput" maxlength="18" placeholder="品种，比如：柯基、金毛、田园犬" autocomplete="off" />
                <button class="primary-btn" id="startBtn" type="button">点击测试</button>
              </div>
            </div>
            <p class="designer">Designed by @独居饲养员少卿</p>
          </div>
        </div>
      </section>

      <section class="screen" id="quizScreen">
        <div class="quiz-shell">
          <article class="quiz-card">
            <div class="topbar">
              <div class="counter" id="counter">第 1 / 10 题</div>
              <div class="meter" aria-hidden="true"><span id="meter"></span></div>
            </div>
            <div class="quiz-body">
              <div class="kicker" id="kicker">DOG 01</div>
              <h2 class="question" id="question"></h2>
              <p class="hint" id="hint"></p>
              <div class="answers" id="answers"></div>
              <div class="nav">
                <button class="ghost-btn" id="backBtn" type="button">上一题</button>
                <button class="primary-btn" id="nextBtn" type="button" disabled>下一题</button>
              </div>
            </div>
          </article>
        </div>
      </section>

      <section class="screen" id="resultScreen">
        <div class="result-shell">
          <article class="result-card" id="shareCard">
            <div class="result-copy">
              <p class="result-dog" id="resultDog">你的狗</p>
              <div class="result-code" id="resultCode">CODE</div>
              <h2 class="result-title" id="resultName">狗格</h2>
              <div class="result-media">
                <img id="resultImage" alt="狗格结果图" />
              </div>
              <p class="verdict" id="resultVerdict">判词</p>
              <div class="result-actions">
                <button class="primary-btn" id="shareBtn" type="button">分享给你的狗</button>
                <button class="ghost-btn" id="againBtn" type="button">重新测试</button>
              </div>
            </div>
          </article>
        </div>
      </section>
    </main>
    <div class="toast" id="toast">已生成分享图。</div>
    <div class="share-modal" id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareTitle">
      <div class="share-panel">
        <h3 id="shareTitle">你的狗格海报已生成</h3>
        <p>长按图片或点击保存，把这张判词发给你的狗看。</p>
        <img class="share-preview" id="sharePreview" alt="DBTI 分享海报预览" />
        <div class="share-modal-actions">
          <button class="primary-btn" id="savePosterBtn" type="button">保存海报</button>
          <button class="ghost-btn" id="copyTextBtn" type="button">复制判词</button>
          <button class="ghost-btn" id="closeShareBtn" type="button">关闭</button>
        </div>
      </div>
    </div>

    <script>
      const resultImageFiles = {
        "yes or no": "assets/results/yes-or-no.jpg",
        "502": "assets/results/502.jpg",
        drama: "assets/results/drama.jpg",
        momo: "assets/results/momo.jpg",
        Zzzzz: "assets/results/Zzzzz.jpg",
        emo: "assets/results/emo.jpg",
        dad: "assets/results/dad.jpg",
        salty: "assets/results/salty.jpg",
        social: "assets/results/social.jpg",
        lazy: "assets/results/lazy.jpg",
        taotie: "assets/results/taotie.jpg",
        "404 Not Found": "assets/results/404-not-found.jpg",
        Vme50: "assets/results/Vme50.jpg",
        guard: "assets/results/guard.jpg",
        8080: "assets/results/8080.jpg",
        shift: "assets/results/shift.jpg",

      const breedOptions = [
        { key: "poodle", name: "贵宾犬", aliases: ["贵宾犬", "贵宾", "泰迪"] },
        { key: "chinese-rural-dog", name: "中华田园犬", aliases: ["中华田园犬", "土狗", "田园犬"] },
        { key: "golden-retriever", name: "金毛寻回犬", aliases: ["金毛寻回犬", "金毛"] },

        { key: "corgi", name: "威尔士柯基犬", aliases: ["威尔士柯基犬", "柯基"] },
        { key: "shiba-inu", name: "日本柴犬", aliases: ["日本柴犬", "柴犬"] },
        { key: "border-collie", name: "边境牧羊犬", aliases: ["边境牧羊犬", "边牧"] },
        { key: "french-bulldog", name: "法国斗牛犬", aliases: ["法国斗牛犬", "法斗"] },
        { key: "samoyed", name: "萨摩耶犬", aliases: ["萨摩耶犬", "萨摩"] },
        { key: "siberian-husky", name: "西伯利亚雪橇犬", aliases: ["西伯利亚雪橇犬", "哈士奇", "二哈"] },

        { key: "pug", name: "巴哥犬", aliases: ["巴哥犬", "巴哥"] },
        { key: "chihuahua", name: "吉娃娃犬", aliases: ["吉娃娃犬", "吉娃娃"] },
        { key: "yorkshire-terrier", name: "约克夏梗", aliases: ["约克夏梗", "约克夏"] },
        { key: "alaskan-malamute", name: "阿拉斯加雪橇犬", aliases: ["阿拉斯加雪橇犬", "阿拉斯加", "阿拉"] },
        { key: "pomeranian", name: "博美犬", aliases: ["博美犬", "博美"] },
        { key: "german-shepherd", name: "德国牧羊犬", aliases: ["德国牧羊犬", "德牧", "黑背"] },
        { key: "kunming-dog", name: "昆明犬", aliases: ["昆明犬"] },
        { key: "shih-tzu", name: "西施犬", aliases: ["西施犬", "西施"] },
        { key: "shetland-sheepdog", name: "喜乐蒂牧羊犬", aliases: ["喜乐蒂牧羊犬", "喜乐蒂"] },
        { key: "maltese", name: "马尔济斯犬", aliases: ["马尔济斯犬", "马尔济斯"] },

      function buildQuestionBank() {
        const bank = [...baseQuestions];
        let i = 0;
        while (bank.length < 100) {
          const [q, hint, answers] = questionTemplates[i % questionTemplates.length];
          const round = Math.floor(i / questionTemplates.length) + 1;
          bank.push({
            q,
            hint: round === 1 ? hint : hint + " 第 " + round + " 次测，直觉也算答案。",
            a: answers.map(([title, desc, traits]) => ({ title, desc, traits })),
          });
          i += 1;
        }
        return bank;
      }

      const questionBank = buildQuestionBank();

      function getRandomQuestions(arr, count) {
        const shuffled = [...arr];
        for (let i = shuffled.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        return shuffled.slice(0, count);
      }

          .replaceAll("你的狗", name)
          .replaceAll("你家狗", name)
          .replaceAll("给狗", `给${name}`)
          .replaceAll("带狗", `带${name}`)
          .replaceAll("它", name)
          .replaceAll("狗狗", name);
      }

        const item = state.questions[state.index];

        state.answers.forEach((answerIndex, questionIndex) => {
          const answer = state.questions[questionIndex].a[answerIndex];
          Object.entries(answer.traits).forEach(([key, value]) => {
            totals[key] = (totals[key] || 0) + value;
          });
        });

        const entries = Object.entries(traitProfiles)
          .map(([key, profile]) => {
            const allTraits = new Set([...Object.keys(totals), ...Object.keys(profile)]);
            let distance = 0;
            for (const trait of allTraits) {
              distance += Math.abs((totals[trait] || 0) - (profile[trait] || 0));
            }
            return [key, distance];
          })
          .sort((a, b) => a[1] - b[1]);

        const bestDistance = entries[0][1];
        const tied = entries.filter((entry) => entry[1] === bestDistance).map((entry) => entry[0]);
        if (tied.length === 1) return tied[0];
        const answerHash = state.answers.reduce((sum, value, index) => sum + (value + 1) * (index + 3) * 7, 0);
        return tied[answerHash % tied.length];
      }

      function displayCode(key) {
        return key.toUpperCase();
      }

      function showResult() {
        const key = calculateResult();
        const result = types[key];
        state.currentResultKey = key;
        $("resultDog").textContent = `${state.dogName}的 DBTI 是`;
        $("resultCode").textContent = displayCode(key);
        $("resultName").textContent = result.name;
        $("resultVerdict").textContent = personalizeText(result.verdict);
        $("shareBtn").textContent = `分享给${state.dogName}`;
        $("resultImage").onerror = () => {
          $("resultImage").src = "assets/results/yes-or-no.jpg";
        };
        $("resultImage").src = new URL(resultImagePath(key), window.location.href).href;
        $("resultImage").alt = `${result.name}结果图`;
        showScreen("resultScreen");
      }

      function restart() {
        state.index = 0;
        state.answers = [];
        state.questions = getRandomQuestions(questionBank, 10);
        state.currentResultKey = "";
        renderQuestion();
        showScreen("quizScreen");
      }

      function toast(message) {
        const el = $("toast");
        el.textContent = message;
        el.classList.add("show");
        window.setTimeout(() => el.classList.remove("show"), 1800);
      }

      function shareText() {
        const key = state.currentResultKey;
        const result = types[key];
        return `${state.dogName} 是 ${displayCode(key)}｜${result.name}：${personalizeText(result.verdict)}`;
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error(`图片加载失败：${src}`));
          img.src = new URL(src, window.location.href).href;
        });
      }

      async function createShareImage() {
        const key = state.currentResultKey;
        const result = types[key];
        let img;
        try {
          img = await loadImage(resultImagePath(key));
        } catch {
          img = await loadImage(resultImagePath(key, null));
        }
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1440;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#f4edf2";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#a9d9c9";
        ctx.fillRect(0, 0, canvas.width, 360);
        ctx.fillStyle = "#dfbd52";
        ctx.fillRect(0, 1080, canvas.width, 360);
        ctx.fillStyle = "#fffdf8";
        roundRect(ctx, 70, 80, 940, 1280, 34);
        ctx.fill();
        ctx.drawImage(img, 140, 150, 800, 800);
        ctx.fillStyle = "#5b9bb2";
        ctx.font = "800 38px sans-serif";
        ctx.fillText(displayCode(key), 140, 1010);
        ctx.fillStyle = "#24232a";
        ctx.font = "900 92px sans-serif";
        ctx.fillText(result.name, 140, 1110);
        ctx.font = "700 38px sans-serif";
        wrapText(ctx, `${state.dogName}：${personalizeText(result.verdict)}`, 140, 1180, 800, 52, 3);
        return new Promise((resolve) => canvas.toBlob(resolve, "image/png", 0.95));
      }

      function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      }

      function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
        let line = "";
        let lines = 0;
        for (const char of text) {
          const test = line + char;
          if (ctx.measureText(test).width > maxWidth && line) {
            ctx.fillText(line, x, y);
            y += lineHeight;
            lines += 1;
            line = char;
            if (lines >= maxLines - 1) break;
          } else {
            line = test;
          }
        }
        if (line) ctx.fillText(line, x, y);
      }

      async function shareResult() {
        try {
          $("shareBtn").disabled = true;
          $("shareBtn").textContent = "生成中...";
          const blob = await createShareImage();
          if (!blob) throw new Error("浏览器没有生成图片文件");
          if (state.shareUrl) URL.revokeObjectURL(state.shareUrl);
          state.shareBlob = blob;
          const url = URL.createObjectURL(blob);
          state.shareUrl = url;
          $("sharePreview").src = url;
          $("shareModal").classList.add("show");
          toast("海报已生成，可以保存了。");
          navigator.clipboard?.writeText(shareText()).catch(() => {
            console.warn("剪贴板不可用，已跳过复制。");
          });
        } catch (error) {
          console.error("分享失败：", error);
          await navigator.clipboard?.writeText(shareText()).catch(() => {});
          if (window.location.protocol === "file:") {
            toast("file 模式不能导出海报，请用 localhost 或上线地址打开。");
          } else {
            toast("海报生成失败，已尽量复制判词。");
          }
        } finally {
          $("shareBtn").disabled = false;
          $("shareBtn").textContent = `分享给${state.dogName}`;
        }
      }

      function saveSharePoster() {
        if (!state.shareBlob || !state.shareUrl) {
          toast("还没有生成海报。");
          return;
        }
        try {
          const link = document.createElement("a");
          link.href = state.shareUrl;
          link.download = `${state.dogName}-${state.breed?.name || "DBTI"}.png`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          toast("海报已保存。");
        } catch (error) {
          console.error("保存失败：", error);
          toast("保存失败，可以长按海报保存。");
        }
      }

      function closeShareModal() {
        $("shareModal").classList.remove("show");
      }

      async function copyShareText() {
        try {
          await navigator.clipboard.writeText(shareText());
          toast("判词已复制。");
        } catch {
          toast("复制失败，可以手动截图。");
        }
      }

      $("startBtn").addEventListener("click", () => {
        const name = $("dogNameInput").value.trim();
        if (!name) {
          toast("先写狗狗名字，不然没法开庭。");
          $("dogNameInput").focus();
          return;
        }
        state.dogName = name;
        state.breedInput = $("breedInput").value.trim();
        state.breed = matchBreed(state.breedInput);
        state.index = 0;
        state.answers = [];
        state.questions = getRandomQuestions(questionBank, 10);
        renderQuestion();
        showScreen("quizScreen");
      });

      $("dogNameInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") $("startBtn").click();
      });

      $("breedInput").addEventListener("keydown", (event) => {
        if (event.key === "Enter") $("startBtn").click();
      });

      $("backBtn").addEventListener("click", () => {
        if (state.index === 0) return;
        state.index -= 1;
        renderQuestion();
      });
      $("nextBtn").addEventListener("click", nextQuestion);
      $("shareBtn").addEventListener("click", shareResult);
      $("savePosterBtn").addEventListener("click", saveSharePoster);
      $("copyTextBtn").addEventListener("click", copyShareText);
      $("closeShareBtn").addEventListener("click", closeShareModal);
      $("shareModal").addEventListener("click", (event) => {
        if (event.target === $("shareModal")) closeShareModal();
      });
      $("againBtn").addEventListener("click", restart);
    </script>
  </body>
</html>
